services:
  lark-mcp:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: nascent-registry.cn-zhangjiakou.cr.aliyuncs.com/e-nascent/lark-mcp-server:1.0.2
    container_name: lark-mcp-server
    restart: unless-stopped
    ports:
      - "${LARK_MCP_PORT:-3000}:3000"
    environment:
      # App ID allowlist for the proxy mode (comma/space separated). Empty = no restriction.
      LARK_ALLOW_APP_IDS: ${LARK_ALLOW_APP_IDS:-}
      # Service-level access token allowlist (comma/space separated). Empty = no auth.
      LARK_SERVER_ACCESS_TOKENS: ${LARK_SERVER_ACCESS_TOKENS:-}
      # Default tool preset (can be overridden per client).
      LARK_TOOLS: ${LARK_TOOLS:-preset.default}
      # Default API domain; clients can override per request via X-Domain header.
      LARK_DOMAIN: ${LARK_DOMAIN:-https://open.feishu.cn}
      # Default token mode.
      LARK_TOKEN_MODE: ${LARK_TOKEN_MODE:-auto}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
